name: Bug report
description: Something in SearchAble isn't working as expected
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SearchAble!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen. For a search that found the wrong files, or none, write the query too.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots (optional)
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf"
  - type: upload
    id: log
    attributes:
      label: Log file
      description: |
        **The log lists the names and paths of files that could not be read.** You can open it and delete lines before uploading.

        The log files `error.log` (the window) and `agent.log` (indexing) are in the SearchAble folder. To upload them:
        1. Copy the folder path:
           ```text
           %LOCALAPPDATA%\SearchAble
           ```
        2. Click the box below. A file window opens.
        3. Paste the path into the **File name** field and press **Enter**. The folder opens.
        4. Select `error.log` (and `agent.log`) and click **Open**.

        Or press **Win+R**, paste the path, press **Enter**, and drag the files from the folder that opens into the box below.
    validations:
      required: true
      accept: ".log,.txt"
  - type: textarea
    id: environment
    attributes:
      label: System details
      description: Filled in automatically by the app.
      render: text
    validations:
      required: true
