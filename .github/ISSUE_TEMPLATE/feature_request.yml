name: Feature request
description: An idea to improve SearchAble, or a new feature
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like SearchAble to do?
      description: Describe the feature and how it would help you find files.
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshot or sketch (optional)
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf"
  - type: upload
    id: log
    attributes:
      label: Log file (optional)
      description: |
        Attach it if it helps explain the idea. **The log lists the names and paths of files that could not be read.** You can open it and delete lines before uploading.

        The log file `error.log` is in the SearchAble folder. To upload it:
        1. Copy the folder path:
           ```text
           %LOCALAPPDATA%\SearchAble
           ```
        2. Click the box below. A file window opens.
        3. Paste the path into the **File name** field and press **Enter**. The folder opens.
        4. Select `error.log` and click **Open**.
    validations:
      required: false
      accept: ".log,.txt"
  - type: textarea
    id: environment
    attributes:
      label: System details
      description: Filled in automatically by the app.
      render: text
    validations:
      required: true
